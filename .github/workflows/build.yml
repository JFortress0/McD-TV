# Builds the McD TV APK in the cloud on every push to main.
# Output: (1) a downloadable workflow artifact, (2) a GitHub Release with the APK attached.
# The Release always includes McD-TV.apk, so this link never changes:
#   https://github.com/<you>/<repo>/releases/latest/download/McD-TV.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The signing key lives in a GitHub secret, never in the code.
      # Same key every build = the Fire Stick accepts each new APK as an update.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/mcdtv.jks
            echo "Signing key restored."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. Building with a temporary key; you may need to uninstall before updating."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          VERSION="0.2.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "McD-TV-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "McD-TV.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: McD-TV-v${{ env.VERSION }}
          path: McD-TV-v${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: McD TV v${{ env.VERSION }}
          body: "Built from commit ${{ github.sha }}. Install on Fire TV with the Downloader app."
          make_latest: true
          files: |
            McD-TV-v${{ env.VERSION }}.apk
            McD-TV.apk
